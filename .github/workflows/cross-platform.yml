name: Cross-platform core

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: CrossPlatform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test portable decision core
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Generate and evaluate boundary hard cases
        env:
          PYTHONPATH: CrossPlatform/src
        working-directory: ${{ github.workspace }}
        run: |
          python Training/hard_case_corpus.py
          python Training/evaluate_hard_cases.py Training/generated/savepilot-hard-cases-v1.jsonl
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Build universal wheel
        run: python -m pip wheel --no-deps --wheel-dir wheelhouse .
