name: macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native app
        run: zsh Scripts/build-app.sh release
      - name: Run native regression suite
        run: zsh Scripts/run-self-test.sh
      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/SavePilot.app SavePilot-macOS.zip
          shasum -a 256 SavePilot-macOS.zip > SavePilot-macOS.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SavePilot-macOS
          path: |
            SavePilot-macOS.zip
            SavePilot-macOS.zip.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" SavePilot-macOS.zip SavePilot-macOS.zip.sha256 --generate-notes --title "SavePilot $GITHUB_REF_NAME"
